<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödev Merkezi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

/* Sayfalar */

.page{
    display:none;
    min-height:100vh;
}

.active{
    display:flex;
}

/* Açılış */

#welcome{
    width:100vw;
    height:100vh;
    cursor:pointer;

    background-image:
    url("Ekran görüntüsü 2026-10-20 180628.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Dersler */

#subjects{
    display:none;
    flex-direction:column;
    align-items:center;
    padding:40px 20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:35px;
}

.logo svg{
    width:60px;
    height:60px;
}

.logo h1{
    font-size:32px;
}

.logo p{
    color:#94a3b8;
}

.subject-grid{
    width:90%;
    max-width:1000px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.subject-btn{
    background:#1e293b;
    border:2px solid #334155;
    color:white;

    padding:18px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;

    transition:.2s;
}

.subject-btn:hover{
    background:#334155;
}

/* İngilizce Sayfası */

#english{
    display:none;
    position:relative;
    width:100vw;
    height:100vh;
}

#english img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

.back{
    position:absolute;
    top:20px;
    left:20px;

    z-index:10;

    border:none;
    background:#dc2626;
    color:white;

    padding:12px 22px;
    border-radius:8px;

    cursor:pointer;
}

.back:hover{
    background:#b91c1c;
}
</style>
</head>
<body>

<!-- Açılış -->

<div id="welcome" class="page active"></div>

<!-- Dersler -->

<div id="subjects" class="page">

    <div class="logo">

        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#2563eb"/>
            <path d="M20 40L50 25L80 40L50 55L20 40Z" fill="white"/>
            <rect x="45" y="55" width="10" height="18" fill="white"/>
        </svg>

        <div>
            <h1>Ödev Merkezi</h1>
            <p>Tüm dersler tek yerde</p>
        </div>

    </div>

    <div class="subject-grid">

        <button class="subject-btn">Türkçe</button>

        <button class="subject-btn" onclick="openEnglish()">
            İngilizce
        </button>

        <button class="subject-btn">Matematik</button>

        <button class="subject-btn">Fen Bilimleri</button>

        <button class="subject-btn">Sosyal Bilgiler</button>

        <button class="subject-btn">Din Kültürü</button>

        <button class="subject-btn">Bilişim Teknolojileri</button>

        <button class="subject-btn">Görsel Sanatlar</button>

        <button class="subject-btn">Müzik</button>

        <button class="subject-btn">Beden Eğitimi</button>

    </div>

</div>

<!-- İngilizce -->

<div id="english">

    <button class="back" onclick="backToSubjects()">
        ← Geri
    </button>

    <img
    src="Ekran görüntüsü 2026-10-20 180628.png"
    alt="İngilizce Ödevi">

</div>

<script>

const welcome =
document.getElementById("welcome");

const subjects =
document.getElementById("subjects");

const english =
document.getElementById("english");

welcome.addEventListener("click",()=>{

    welcome.style.display="none";
    subjects.style.display="flex";

});

function openEnglish(){

    subjects.style.display="none";
    english.style.display="block";

}

function backToSubjects(){

    english.style.display="none";
    subjects.style.display="flex";

}

document.querySelectorAll(".subject-btn").forEach(btn=>{

    if(btn.innerText !== "İngilizce"){

        btn.addEventListener("click",()=>{

            alert("Bu ders henüz eklenmedi.");

        });

    }

});

</script>

</body>
</html>
