<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödev Merkezi</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fb;
    color:#222;
}

/* Sayfalar */

.page{
    display:none;
    min-height:100vh;
}

.active{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* Açılış */

#welcome{
    background:
    linear-gradient(rgba(255,255,255,.15),
    rgba(255,255,255,.15)),
    url("Ekran görüntüsü 2026-10-20 180628.png");

    background-size:cover;
    background-position:center;
    cursor:pointer;
    text-align:center;
}

#welcome h1{
    color:white;
    font-size:70px;
    text-shadow:0 3px 10px rgba(0,0,0,.5);
}

#welcome p{
    color:white;
    margin-top:15px;
    font-size:24px;
}

/* Dersler */

#subjects{
    padding:40px 20px;
    background:#f5f7fb;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:35px;
}

.logo svg{
    width:60px;
    height:60px;
}

.logo h1{
    font-size:32px;
    color:#1e3a8a;
}

.logo p{
    color:#64748b;
}

.subject-grid{
    width:90%;
    max-width:1000px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.subject-btn{
    background:white;
    color:#222;

    border:1px solid #dbe3ee;
    border-radius:12px;

    padding:18px;
    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.subject-btn:hover{
    background:#eef4ff;
    transform:translateY(-2px);
}

/* İngilizce */

#english{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#english img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:white;
}

.back{
    position:absolute;
    top:20px;
    left:20px;

    border:none;
    border-radius:10px;

    background:#2563eb;
    color:white;

    padding:12px 22px;
    cursor:pointer;

    z-index:999;
}

.back:hover{
    background:#1d4ed8;
}

@media(max-width:700px){

    #welcome h1{
        font-size:42px;
    }

    .logo h1{
        font-size:25px;
    }

}

</style>
</head>
<body>

<!-- GİRİŞ -->

<div id="welcome" class="page active">
    <h1>LET'S GET STARTED</h1>
    <p>Başlamak için tıklayın</p>
</div>

<!-- DERSLER -->

<div id="subjects" class="page">

    <div class="logo">

        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#2563eb"/>
            <path d="M20 40L50 25L80 40L50 55L20 40Z"
            fill="white"/>
            <rect x="45" y="55"
            width="10"
            height="16"
            fill="white"/>
        </svg>

        <div>
            <h1>Ödev Merkezi</h1>
            <p>Tüm dersler tek yerde</p>
        </div>

    </div>

    <div class="subject-grid">

        <button class="subject-btn">Türkçe</button>

        <button class="subject-btn"
        onclick="openEnglish()">
            İngilizce
        </button>

        <button class="subject-btn">Matematik</button>

        <button class="subject-btn">Fen Bilimleri</button>

        <button class="subject-btn">Sosyal Bilgiler</button>

        <button class="subject-btn">Din Kültürü</button>

        <button class="subject-btn">Bilişim Teknolojileri</button>

        <button class="subject-btn">Görsel Sanatlar</button>

        <button class="subject-btn">Müzik</button>

        <button class="subject-btn">Beden Eğitimi</button>

    </div>

</div>

<!-- İNGİLİZCE -->

<div id="english" class="page">

    <button class="back"
    onclick="backToSubjects()">
        Geri
    </button>

    <img src="Ekran görüntüsü 2026-10-20 180628.png"
    alt="İngilizce Ödevi">

</div>

<script>

const welcome = document.getElementById("welcome");
const subjects = document.getElementById("subjects");
const english = document.getElementById("english");

welcome.onclick = function(){
    welcome.classList.remove("active");
    subjects.classList.add("active");
}

function openEnglish(){
    subjects.classList.remove("active");
    english.classList.add("active");
}

function backToSubjects(){
    english.classList.remove("active");
    subjects.classList.add("active");
}

document.querySelectorAll(".subject-btn").forEach(btn=>{

    if(btn.innerText !== "İngilizce"){

        btn.addEventListener("click",function(){
            alert("Bu ders henüz eklenmedi.");
        });

    }

});

</script>

</body>
</html>
