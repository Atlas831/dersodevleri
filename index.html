<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ödev Merkezi</title>
<link rel="icon" href="logo.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef5ff;
}

/* Üst Menü */

.topbar{
    background:#0c4a8a;
    color:white;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-area img{
    width:45px;
    height:45px;
    border-radius:10px;
}

.logo-area h1{
    font-size:28px;
}

.user{
    font-size:18px;
}

/* Hoşgeldin */

.welcome{
    padding:30px;
}

.welcome h2{
    color:#1e3a8a;
    font-size:42px;
}

/* Kartlar */

.cards{
    padding:0 30px 30px;

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:20px;
}

.card{
    background:white;

    border-radius:25px;

    padding:30px;

    min-height:220px;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:#1e40af;
    margin-bottom:15px;
    font-size:28px;
}

.card p{
    color:#64748b;
}

.big-card{
    background:linear-gradient(
    135deg,
    #3b82f6,
    #1e3a8a
    );

    color:white;
}

.big-card h3{
    color:white;
}

.big-card p{
    color:#e2e8f0;
}

/* Ders Görseli */

#englishPage{
    display:none;

    position:fixed;
    inset:0;

    background:black;
}

#englishPage img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.back{
    position:absolute;

    top:20px;
    left:20px;

    border:none;

    background:#dc2626;
    color:white;

    padding:12px 20px;

    border-radius:10px;

    cursor:pointer;

    z-index:100;
}

.back:hover{
    background:#b91c1c;
}

</style>
</head>
<body>

<div id="mainPage">

    <div class="topbar">

        <div class="logo-area">
            <img src="logo.png" alt="">
            <h1>Ödev Merkezi</h1>
        </div>

        <div class="user">
            Hoş Geldin Atlas Asil
        </div>

    </div>

    <div class="welcome">
        <h2>Ödev Merkezine Hoş Geldin</h2>
    </div>

    <div class="cards">

        <div class="card big-card" onclick="openEnglish()">
            <h3>İngilizce</h3>
            <p>İngilizce ödevlerini görüntülemek için tıklayın.</p>
        </div>

        <div class="card">
            <h3>Türkçe</h3>
            <p>Yakında eklenecek.</p>
        </div>

        <div class="card">
            <h3>Matematik</h3>
            <p>Yakında eklenecek.</p>
        </div>

        <div class="card">
            <h3>Fen Bilimleri</h3>
            <p>Yakında eklenecek.</p>
        </div>

        <div class="card">
            <h3>Sosyal Bilgiler</h3>
            <p>Yakında eklenecek.</p>
        </div>

        <div class="card">
            <h3>Bilişim Teknolojileri</h3>
            <p>Yakında eklenecek.</p>
        </div>

    </div>

</div>

<div id="englishPage">

    <button class="back" onclick="closeEnglish()">
        ← Geri
    </button>

    <img src="Ekran görüntüsü 2026-10-20 180628.png">

</div>

<script>

function openEnglish(){

    document.getElementById("mainPage").style.display="none";
    document.getElementById("englishPage").style.display="block";

}

function closeEnglish(){

    document.getElementById("englishPage").style.display="none";
    document.getElementById("mainPage").style.display="block";

}

</script>

</body>
</html>
